name: CI

on:
  pull_request:
  push:
    branches: [main.feature]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # No database service needed: tests patch SessionLocal and never connect.
      - name: Test (pytest)
        run: pytest tests/
