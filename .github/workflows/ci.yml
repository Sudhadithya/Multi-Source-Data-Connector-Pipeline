name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"

# Least privilege: this workflow only ever reads the repo.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # No database service needed: tests patch SessionLocal and never connect.
      - name: Test (pytest)
        run: pytest tests/
